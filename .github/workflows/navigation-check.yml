name: navigation-check

on:
  push:
    branches: [main]
  # Always run: new workspace/config paths must not bypass navigation checks.
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run navigation structure and boundary check
        run: pnpm navigation:check

      - name: Reject new source ownership gaps
        if: github.event_name == 'pull_request'
        env:
          NAVIGATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm navigation:check --since "$NAVIGATION_BASE"

      - name: Run navigation fixture tests
        run: pnpm test:navigation
