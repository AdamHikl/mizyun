# Self-hosted CI gate — SSHes into Adam's Slovakia PC and runs
# `pnpm db:verify` against the long-lived Supabase stack.
#
# This is the canonical CI gate once the alpha track is the
# active deployment target per INFRA-SELFHOST-001. It depends on
# the GitHub Environment `hosted-selfhost` carrying the SSH key
# + remote host secret; the workflow refuses to run otherwise.
#
# Why a separate workflow: `db-verify.yml` runs against the
# runner's local Supabase (which is what `pnpm db:start` starts on
# the runner). That covers schema correctness. This workflow
# covers "does it actually run on the alpha PC's Supabase stack"
# — a separate concern with a separate secret surface.
name: db-verify-selfhosted

on:
  pull_request:
    paths:
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/db-verify-selfhosted.yml"

  workflow_dispatch: {}

concurrency:
  group: db-verify-selfhosted
  cancel-in-progress: false

jobs:
  verify-selfhosted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: hosted-selfhost
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the deploy SSH key
        env:
          MIZYUN_DEPLOY_SSH_KEY: ${{ secrets.MIZYUN_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$MIZYUN_DEPLOY_SSH_KEY" ]; then
            echo "::error::MIZYUN_DEPLOY_SSH_KEY secret is missing"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$MIZYUN_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519_mizyun
          chmod 600 ~/.ssh/id_ed25519_mizyun
          ssh-keyscan -H "${{ secrets.MIZYUN_PC_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: SSH into PC and run db:verify
        env:
          MIZYUN_PC_HOST: ${{ secrets.MIZYUN_PC_HOST }}
          MIZYUN_PC_USER: ${{ secrets.MIZYUN_PC_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519_mizyun \
            -o BatchMode=yes \
            "${MIZYUN_PC_USER}@${MIZYUN_PC_HOST}" \
            "cd ~/mizyun && git pull --ff-only && pnpm install --frozen-lockfile && pnpm db:verify"

      - name: Report
        if: always()
        run: |
          echo "Self-hosted db:verify completed with status: $?"
          echo "If the SSH step failed, confirm the PC tunnel is healthy via 'cloudflared tunnel info mizyun-alpha'."
